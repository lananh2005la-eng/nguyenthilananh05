<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - LORAN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f8f8f8; font-family: Arial; }
        .cart-box { max-width: 800px; margin: 30px auto; background: #fff; padding: 20px; border-radius: 8px; }
        .stepper { display: flex; justify-content: center; border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .step { flex: 1; text-align: center; color: #ccc; font-size: 13px; }
        .step.active { color: #8B0000; font-weight: bold; }
        .cart-item { display: flex; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f5f5f5; align-items: center; }
        .total-row { display: flex; justify-content: space-between; padding: 20px 0; font-size: 20px; font-weight: bold; }
        .btn-checkout { width: 100%; background: #e31e24; color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <header style="background:#fff; padding:15px; border-bottom:1px solid #eee; text-align:center;">
        <a href="index.html"><img src="img/logo.png" style="height:40px;"></a>
    </header>

    <div class="cart-box">
    <div id="cartList"></div>
    <div class="total-row" style="display:flex; justify-content:space-between; font-weight:bold; padding:20px 0;">
        <span>Tổng tiền:</span>
        <span id="totalPrice" style="color:red; font-size:20px;">0đ</span>
    </div>
    <button class="btn-checkout" onclick="location.href='checkout.html'" style="width:100%; background:red; color:white; padding:15px; border:none; cursor:pointer; font-weight:bold;">ĐẶT HÀNG NGAY</button>
</div>

<script>
    const render = () => {
        let cart = JSON.parse(localStorage.getItem('myCart')) || [];
        let list = document.getElementById('cartList');
        let totalMoney = 0;
        let html = "";

        if (cart.length === 0) {
            list.innerHTML = "<p style='text-align:center; padding:20px;'>Giỏ hàng trống!</p>";
            document.getElementById('totalPrice').innerText = "0đ";
            return;
        }

        cart.forEach((item, index) => {
            // Ép kiểu về số để đảm bảo không bị lỗi NaN
            let price = Number(item.price) || 0;
            let qty = Number(item.qty) || 0;
            let subTotal = price * qty;
            totalMoney += subTotal;

            html += `
                <div style="display:flex; align-items:center; gap:15px; padding:15px 0; border-bottom:1px solid #eee;">
                    <img src="${item.img}" style="width:60px; height:60px; object-fit:cover;">
                    <div style="flex:1;">
                        <h4 style="margin:0; font-size:14px;">${item.title}</h4>
                        <button onclick="remove(${index})" style="color:red; border:none; background:none; cursor:pointer; font-size:12px;">Xóa</button>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold; color:red;">${subTotal.toLocaleString()}đ</div>
                        <div style="font-size:12px; color:#666;">SL: ${qty}</div>
                    </div>
                </div>`;
        });
        
        list.innerHTML = html;
        document.getElementById('totalPrice').innerText = totalMoney.toLocaleString() + "đ";
    };

    const remove = (i) => {
        let cart = JSON.parse(localStorage.getItem('myCart')) || [];
        cart.splice(i, 1);
        localStorage.setItem('myCart', JSON.stringify(cart));
        render();
    };

    window.onload = render;
</script>
</body>
</html>
