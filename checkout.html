<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh Toán - LORAN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; }
        .checkout-container { max-width: 800px; margin: 50px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-order { width: 100%; background: #8B0000; color: white; padding: 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .auth-notice { text-align: center; padding: 50px; }
        .payment-methods { display: flex; gap: 10px; margin: 10px 0; }
        .method-item { flex: 1; border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; border-radius: 4px; }
        .method-item.active { border-color: #8B0000; background: #fff5f5; color: #8B0000; font-weight: bold; }
    </style>
</head>
<body>

<div class="checkout-container">
    <div id="authRequired" class="auth-notice" style="display: none;">
        <i class="fa fa-lock" style="font-size: 50px; color: #ccc;"></i>
        <h2>BẠN CẦN ĐĂNG NHẬP ĐỂ ĐẶT HÀNG</h2>
        <button onclick="location.href='index.html'" class="btn-order" style="background: #333; margin-top: 20px;">VỀ TRANG CHỦ</button>
    </div>

    <div id="checkoutForm" style="display: none;">
        <h2 style="color: #8B0000; border-bottom: 2px solid #8B0000; padding-bottom: 10px;">THÔNG TIN GIAO HÀNG</h2>
        
        <div class="form-group">
            <label>Họ và tên người nhận *</label>
            <input type="text" id="custName" placeholder="Nhập đầy đủ họ tên">
        </div>

        <div class="form-group">
            <label>Số điện thoại *</label>
            <input type="tel" id="custPhone" placeholder="Số điện thoại nhận hàng">
        </div>

        <div class="form-group">
            <label>Địa chỉ nhận hàng *</label>
            <textarea id="custAddress" rows="3" placeholder="Số nhà, tên đường..."></textarea>
        </div>

        <h3>PHƯƠNG THỨC THANH TOÁN</h3>
        <div class="payment-methods">
            <div class="method-item active" onclick="selectMethod(this, 'Tiền mặt')">Tiền mặt (COD)</div>
            <div class="method-item" onclick="selectMethod(this, 'Chuyển khoản')">Chuyển khoản</div>
            <div class="method-item" onclick="selectMethod(this, 'Thẻ')">Ví / Thẻ</div>
        </div>

        <div id="orderSummary" style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 4px;"></div>

        <button class="btn-order" onclick="confirmOrder()">XÁC NHẬN ĐẶT HÀNG</button>
    </div>
</div>

<script>
    let selectedPayment = "Tiền mặt";

    // 1. Kiểm tra đăng nhập
    function checkAuth() {
        const user = localStorage.getItem('currentUser');
        if (!user) {
            document.getElementById('authRequired').style.display = 'block';
            document.getElementById('checkoutForm').style.display = 'none';
        } else {
            document.getElementById('authRequired').style.display = 'none';
            document.getElementById('checkoutForm').style.display = 'block';
            displaySummary();
        }
    }

    // 2. Chọn phương thức thanh toán
    function selectMethod(el, method) {
        document.querySelectorAll('.method-item').forEach(m => m.classList.remove('active'));
        el.classList.add('active');
        selectedPayment = method;
    }

    // 3. Hiển thị tóm tắt đơn hàng
    function displaySummary() {
        let cart = JSON.parse(localStorage.getItem('myCart')) || [];
        let total = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
        
        document.getElementById('orderSummary').innerHTML = `
            <p>Sản phẩm: <strong>${cart.length} món</strong></p>
            <p style="font-size: 20px; color: #8B0000;">Tổng tiền: <strong>${total.toLocaleString()}đ</strong></p>
        `;
    }

    // 4. Xử lý đặt hàng
    function confirmOrder() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const address = document.getElementById('custAddress').value;

        if (!name || !phone || !address) {
            alert("Vui lòng điền đầy đủ thông tin giao hàng!");
            return;
        }

        let cart = JSON.parse(localStorage.getItem('myCart')) || [];
        if(cart.length === 0) {
            alert("Giỏ hàng đang trống!");
            return;
        }

        let total = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);

        const newOrder = {
            id: "LR" + Math.floor(Math.random() * 10000),
            customer: name,
            phone: phone,
            address: address,
            payment: selectedPayment,
            items: cart.map(i => i.title).join(", "),
            total: total,
            status: "Đang chờ"
        };

        // Lưu vào kho đơn hàng chung
        let allOrders = JSON.parse(localStorage.getItem('allOrders')) || [];
        allOrders.push(newOrder);
        localStorage.setItem('allOrders', JSON.stringify(allOrders));

        // Xóa giỏ hàng và thông báo
        localStorage.removeItem('myCart');
        alert("Chúc mừng! Đơn hàng của bạn đã được gửi tới hệ thống LORAN.");
        window.location.href = "index.html";
    }

    window.onload = checkAuth;
</script>

</body>
</html>
